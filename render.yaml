# Render Blueprint for the Campus Connect BACKEND (FastAPI + SQLite, JSON API).
#
# The React SPA is deployed separately on Vercel (frontend/vercel.json). Vercel rewrites /api/* and
# /uploads/* to this service, so the browser only ever sees ONE origin (the Vercel domain): session
# cookies are first-party and no CORS configuration is needed.
#
# A persistent disk requires a PAID instance type (starter or higher). On the free plan the
# filesystem is ephemeral and the SQLite database + uploads are wiped on every deploy/restart.
services:
  - type: web
    name: campus-connect
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # EXACTLY ONE process: the meeting-reminder APScheduler job lives in-process and SQLite has a
    # single writer. Never raise --workers.
    # --no-proxy-headers: uvicorn must NOT rewrite the client address itself; the app does it
    # (TRUST_PROXY=1 -> api.security.ProxyHeadersMiddleware, which honours TRUST_PROXY_HOPS).
    startCommand: python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers
    healthCheckPath: /healthz
    disk:
      name: campus-connect-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # production => Secure session cookie, HSTS, SECRET_KEY validation, /docs disabled.
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/campusconnect.db
      - key: UPLOAD_ROOT
        value: /var/data/uploads
      # Honour X-Forwarded-* (client IP for rate limiting, https scheme).
      - key: TRUST_PROXY
        value: "1"
      # Proxies in front of the app: Vercel rewrite + Render's load balancer = 2.
      # Use "1" if a custom domain points straight at Render and Vercel is not in the path.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # First-admin bootstrap (idempotent, never overwrites an existing password).
      # Fill ADMIN_* in the Render dashboard; the values are NOT stored in this file.
      - key: BOOTSTRAP_ADMIN
        value: "1"
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REMINDER_INTERVAL_MINUTES
        value: "60"
